name: Live model audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,parquet]" "apache-airflow==3.1.8"
      - name: Install and start local model service
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          sudo systemctl stop ollama || true
          OLLAMA_CONTEXT_LENGTH=16384 ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama pull qwen2.5:3b
          ollama --version
      - run: python scripts/live_model_smoke.py --out reports/live-model.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-model-report
          path: reports/
